version: '3.8'

services:
  backend:
    container_name: fillin-blue
    image: ${DOCKERHUB_USERNAME}/fillin:latest
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Seoul
    expose:
      - "8080"
    networks:
      - fillin_network
    restart: unless-stopped

  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"   # HTTP
      # - "443:443" # HTTPS (나중에 인증서 받으면 주석 해제)
    volumes:
      # Nginx 설정 파일을 밖에서 넣어줌 (아래 2단계에서 만들 파일)
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
    networks:
      - fillin_network
    restart: always

networks:
  fillin_network:
    driver: bridge