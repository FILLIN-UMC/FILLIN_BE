spring:
  application:
    name: fillin


  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: FillinHikariPool

  management:
    endpoints:
      web:
        exposure:
          include: health
    endpoint:
      health:
        probes:
          enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_REGION} # 예: ap-northeast-2
      s3:
        bucket: ${S3_BUCKET_NAME}
      stack:
        auto: false


server:
  tomcat:
    max-threads: 200              # 운영 인스턴스와 동일하게 유지
    accept-count: 100
    mbeanregistry:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_EXPIRE}    # 1시간
  refresh-token-validity: ${JWT_REFRESH_EXPIRE}  # 2주

kakao:
  client-id: ${KAKAO_REST_API_KEY}
  redirect-uri: http://localhost:8080/api/auth/kakao/callback    # 인가 코드


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true


app:
  env: local


